[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scHopfield"
version = "0.1.0"
description = "Single-cell Hopfield network analysis for gene regulatory networks"
readme = "README.md"
# Set by the dependencies, not by the syntax: scanpy declares >=3.12 and anndata >=3.11,
# so anything lower is unsatisfiable rather than merely untested.
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "scHopfield Contributors"}
]
keywords = [
    "single-cell",
    "bioinformatics",
    "hopfield-network",
    "gene-regulatory-networks",
    "RNA-seq",
    "energy-landscape"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "anndata>=0.11",
    "scanpy>=1.10",
    "torch>=2.2",
    "networkx>=3.0",
    "umap-learn>=0.5.5",
    "scikit-learn>=1.4",
    "tqdm>=4.66",
    "h5py>=3.10",
    "hoggorm>=0.13.3",
]

[project.optional-dependencies]
# prepare_dataset builds the spliced/unspliced moments and the velocity layer through
# scVelo. Every other entry point takes an object that already has them.
velocity = [
    "scvelo>=0.3",
]
# The figure scripts under reproducibility/ are not part of the package, and these are
# the extra libraries they need.
reproducibility = [
    "scvelo>=0.3",
    "adjustText>=1.0",
    "seaborn>=0.13",
    "pyarrow>=15.0",
    "threadpoolctl>=3.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.4",
]
docs = [
    "sphinx>=7.0",
    "pydata-sphinx-theme>=0.15",
    "sphinx-design>=0.5",
    "sphinx-copybutton>=0.5",
    "myst-parser>=2.0",
    "nbsphinx>=0.9",
    "ipykernel>=6.0",
]
optional = [
    "seaborn>=0.13",
    "python-igraph>=0.11",
]
all = [
    "scvelo>=0.3",
    "seaborn>=0.13",
    "python-igraph>=0.11",
]

[project.urls]
Homepage = "https://github.com/Bernaljp/scHopfield"
Documentation = "https://schopfield.readthedocs.io"
Repository = "https://github.com/Bernaljp/scHopfield"
"Bug Tracker" = "https://github.com/Bernaljp/scHopfield/issues"

[tool.setuptools.packages.find]
include = ["scHopfield*"]
namespaces = false

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | _build
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
# Coverage is opt-in: `pytest --cov=scHopfield`. In addopts it makes a plain `pytest`
# fail outright whenever pytest-cov is not installed.
addopts = "-m 'not slow'"
markers = [
    "slow: fits a model; excluded from the default run, always run in CI",
]
